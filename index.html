<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <title>Program Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    /* ========================================
       CSS CUSTOM PROPERTIES (Design Tokens)
       ======================================== */
    :root {
      /* Primary */
      --color-primary-90: #000A14;
      --color-primary-80: #001730;
      --color-primary-70: #0059B8;
      --color-primary-60: #5CABFF;
      --color-primary-30: #C2DFFF;
      --color-primary-20: #F0F1FA;
      --color-primary-10: #F6F7FC;

      /* Secondary */
      --color-secondary-dark: #25A7A1;
      --color-secondary-medium: #4AD7D1;
      --color-secondary-light: #8AE5E1;
      --color-secondary-translucent: rgba(74, 215, 209, 0.3);

      /* Tertiary */
      --color-tertiary-dark: #F53900;
      --color-tertiary-medium: #FF6A3D;
      --color-tertiary-light: #FFB199;
      --color-tertiary-translucent: rgba(255, 106, 61, 0.3);

      /* Grey */
      --color-grey-90: #001730;
      --color-grey-80: #575C64;
      --color-grey-70: #8D939D;
      --color-grey-60: #BDC4D0;
      --color-grey-50: #D7DEE9;
      --color-grey-40: #F0F2F5;
      --color-grey-0: #FFFFFF;

      /* Status — Info */
      --info-dark: #0059B8;
      --info-muted-dark: #ADD5FF;
      --info-muted-med: #D4E9FF;
      --info-muted-light: #EEF6FF;

      /* Status — Warning */
      --warning-dark: #EB9C00;
      --warning-muted-dark: #FFB547;
      --warning-muted-med: #FFDD96;
      --warning-muted-light: #FFE39A;

      /* Status — Success */
      --success-dark: #1A7F5A;
      --success-muted-dark: #00AF70;
      --success-muted-med: #68DEB3;
      --success-muted-light: #E0F5EC;

      /* Status — Destructive */
      --destructive-dark: #890627;
      --destructive-muted-dark: #CE0D3D;
      --destructive-muted-med: #FE8EAA;
      --destructive-muted-light: #FFE1E9;

      /* Usage — Background */
      --color-light-primary: #F6F7FC;
      --color-light-secondary: #FFFFFF;
      --color-light-dark: #F0F1FA;
      --color-dark-primary: #001730;

      /* Usage — Border */
      --color-border-primary: #C2DFFF;
      --color-border-secondary: #5CABFF;

      /* Usage — Text */
      --color-text-dark: #000A14;
      --color-text-muted-dark: #575C64;
      --color-text-muted-med: #8D939D;
      --color-text-muted-light: #BDC4D0;
      --color-text-light: #FFFFFF;
      --color-text-link: #0059B8;

      /* Shadows */
      --shadow-card-default: 0 0 24px rgba(3, 15, 29, 0.08);
      --shadow-card-hover: 0 0 32px rgba(3, 15, 29, 0.2);

      /* Typography */
      --font-family: "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      /* Spacing */
      --space-1: 2px;
      --space-2: 4px;
      --space-3: 6px;
      --space-4: 8px;
      --space-5: 10px;
      --space-6: 12px;
      --space-7: 16px;
      --space-8: 24px;
      --space-9: 32px;
      --space-10: 48px;

      /* Radius */
      --radius-xs: 2px;
      --radius-sm: 4px;
      --radius-lg: 8px;
      --radius-xl: 12px;
      --radius-pill-sm: 16px;
      --radius-pill-md: 20px;
      --radius-pill-lg: 24px;

      /* Motion */
      --duration-fast: 80ms;
      --duration-standard: 120ms;
      --duration-panel: 300ms;
      --ease-default: ease;
      --ease-panel: ease-in-out;

      /* Semantic Aliases */
      --color-text-primary: var(--color-text-dark);
      --color-text-secondary: var(--color-text-muted-dark);
      --color-text-placeholder: var(--color-text-muted-light);
      --color-bg-surface: var(--color-light-secondary);
      --color-bg-page: var(--color-primary-10);
      --color-bg-nav: var(--color-dark-primary);
      --color-bg-nav-selected: var(--color-primary-70);
      --color-border-light: var(--color-border-primary);
      --color-border-medium: var(--color-grey-60);
      --color-border-strong: var(--color-grey-80);
      --color-teal: var(--color-secondary-medium);
      --color-teal-light: var(--color-secondary-light);
      --color-blue: var(--color-primary-70);
      --color-blue-hover: var(--color-primary-20);
      --color-blue-light: var(--color-primary-30);
      --color-blue-bg: var(--color-primary-20);
      --color-amber: var(--color-tertiary-medium);
      --color-amber-light: var(--color-tertiary-light);
      --color-error: var(--destructive-muted-dark);
      --color-achieved: var(--success-muted-med);
      --color-in-progress: var(--warning-muted-dark);
    }

    /* ========================================
       RESET & BASE
       ======================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: var(--font-family);
      font-size: 14px;
      line-height: 20px;
      color: var(--color-text-primary);
      background: var(--color-grey-0);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ========================================
       PAGE LAYOUT
       ======================================== */
    html, body {
      height: 100%;
    }
    .page-layout {
      display: flex;
      min-height: 100vh;
      background: var(--color-light-dark);
    }

    /* ========================================
       NAV SIDEBAR (Level 1)
       ======================================== */
    .nav-demo {
      display: flex;
      width: 80px;
      min-width: 80px;
      flex-direction: column;
      align-items: stretch;
      background: var(--color-dark-primary);
    }

    .nav-item {
      width: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-height: 80px;
      cursor: pointer;
      transition: background var(--duration-standard) var(--ease-default);
      background: var(--color-dark-primary);
      color: var(--color-grey-60);
      text-decoration: none;
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
      transition: color var(--duration-standard) var(--ease-default);
    }
    .nav-item svg,
    .nav-item svg path,
    .nav-item svg circle,
    .nav-item svg rect,
    .nav-item svg line,
    .nav-item svg polyline {
      stroke: currentColor;
      fill: none;
      transition: stroke var(--duration-standard) var(--ease-default);
    }
    .nav-item span {
      font-size: 12px;
      letter-spacing: 0.24px;
      color: currentColor;
      transition: color var(--duration-standard) var(--ease-default);
      text-align: center;
      line-height: normal;
      padding: 0 2px;
    }
    .nav-item:hover {
      color: var(--color-text-light);
    }
    .nav-item.selected {
      background: var(--color-primary-70);
      color: var(--color-text-light);
    }
    .nav-item.disabled {
      cursor: not-allowed;
      color: var(--color-text-muted-dark);
    }
    .nav-item.disabled:hover {
      color: var(--color-text-muted-dark);
    }

    /* ========================================
       MAIN CONTENT AREA
       ======================================== */
    .main-content {
      flex: 1;
      min-width: 0;
      padding: 12px 24px 24px 24px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Page Navigation Bar */
    .page-nav {
      display: flex;
      align-items: center;
      height: 48px;
      width: 100%;
    }
    .page-nav__left {
      display: flex;
      flex: 1;
      gap: 8px;
      align-items: center;
      padding: 14px 0;
    }
    .page-nav__text {
      font-family: var(--font-family);
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: var(--color-text-primary);
      white-space: nowrap;
    }
    .page-nav__separator {
      width: 1px;
      height: 20px;
      background: var(--color-text-secondary);
    }

    /* Program Status Badge */
    .program-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid;
      font-family: var(--font-family);
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      white-space: nowrap;
    }
    .program-status--pre-program {
      background: var(--warning-muted-med);
      border-color: var(--warning-muted-dark);
      color: var(--color-text-dark);
    }

    /* Page Title */
    .page-title {
      display: flex;
      align-items: center;
      gap: 32px;
      width: 100%;
      margin-top: 16px;
    }
    .page-title h1 {
      font-family: var(--font-family);
      font-size: 28px;
      font-weight: 600;
      line-height: 42px;
      color: var(--color-text-primary);
    }

    /* ========================================
       CONTENT WRAP (white card with teal top)
       ======================================== */
    .content-wrap {
      width: 100%;
      background: var(--color-bg-surface);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      margin-top: 24px;
      flex: 1;
    }

    /* ========================================
       LINK LIST
       ======================================== */
    .link-list {
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 0;
    }
    .link-list__item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 12px;
      border-bottom: 1px solid var(--color-border-light);
      text-decoration: none;
      color: var(--color-text-primary);
      transition: background var(--duration-standard) var(--ease-default);
    }
    .link-list__item:first-child {
      border-top: 1px solid var(--color-border-light);
    }
    .link-list__item:hover {
      background: var(--color-blue-hover);
    }
    .link-list__icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }
    .link-list__icon svg {
      width: 24px;
      height: 24px;
      stroke: var(--color-primary-70);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .link-list__text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .link-list__title {
      font-family: var(--font-family);
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      color: var(--color-text-link);
    }
    .link-list__desc {
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 400;
      line-height: 18px;
      color: var(--color-text-secondary);
    }
    .link-list__arrow {
      margin-left: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .link-list__arrow svg {
      width: 20px;
      height: 20px;
      stroke: var(--color-text-muted-med);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>

  <script>
    // Nav item click handling
    document.querySelectorAll('.nav-item:not(.disabled)').forEach(function(item) {
      item.addEventListener('click', function() {
        document.querySelectorAll('.nav-item').forEach(function(ni) {
          ni.classList.remove('selected');
        });
        item.classList.add('selected');
      });
    });
  </script>
</body>
</html>
